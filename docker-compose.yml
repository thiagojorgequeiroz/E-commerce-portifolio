services:
  postgres:
    image: postgres:17
    container_name: e-comerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql

  catalog-api:
    container_name: catalog-api
    build:
      context: ./CatalogApi
      dockerfile: CatalogWebApi/Dockerfile

    depends_on:
      - postgres

    ports:
      - "8080:8080"
      - "8081:8081"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: Host=postgres;Port=5432;Database=catalogdb;Username=postgres;Password=postgres

volumes:
  postgres_data: