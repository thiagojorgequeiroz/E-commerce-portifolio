services:
  postgres:
    image: postgres:17
    container_name: e-comerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Docker-database/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d catalogdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-api:
    container_name: catalog-api
    build:
      context: ./CatalogApi
      dockerfile: CatalogWebApi/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"   # REST + Swagger (HTTP/1.1)
      - "8081:8081"   # gRPC (HTTP/2 cleartext)

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: Host=postgres;Port=5432;Database=catalogdb;Username=postgres;Password=postgres
      Database__ApplyMigrationsOnStartup: "true"
      # gRPC needs HTTP/2; without TLS Kestrel can only serve it on an HTTP/2-only endpoint.
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Http__Protocols: Http1AndHttp2
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      Kestrel__Endpoints__Grpc__Protocols: Http2

volumes:
  postgres_data:
